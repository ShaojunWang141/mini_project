    component: fc3
    props:
      region: cn-beijing
      functionName: result-update
      runtime: python3.9
      handler: index.handler
      code: ./result-update
      timeout: 60
      memorySize: 512
      cpu: 0.35
      internetAccess: true
      environmentVariables:
        DATA_SERVICE_URL: http://123.57.211.134:5002
